name: E2E Smoke Suite

# PRs and main pushes test the checked-out build, independently of deployment.
# Scheduled runs check the currently published staging website.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  smoke-suite:
    name: E2E Smoke Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      BASE_URL: ${{ github.event_name == 'schedule' && 'https://prodtest.useadtool.ai' || 'http://127.0.0.1:5173' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build checked-out frontend
        if: github.event_name != 'schedule'
        run: npm run build

      - name: Run smoke suite
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # PR tests need no private token; keep cockpit uploads for other runs.
          E2E_INGEST_URL: ${{ github.event_name != 'pull_request' && 'https://lbunafpxuskwmsrraqxl.functions.supabase.co/ingest-e2e-results' || '' }}
          E2E_INGEST_TOKEN: ${{ github.event_name != 'pull_request' && secrets.E2E_INGEST_TOKEN || '' }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "schedule" ]]; then
            npm run preview -- \
              --host 127.0.0.1 \
              --port 5173 \
              --strictPort > /tmp/adtool-preview.log 2>&1 &

            preview_pid=$!
            trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
            ready=false

            for attempt in $(seq 1 60); do
              if ! kill -0 "$preview_pid" 2>/dev/null; then
                cat /tmp/adtool-preview.log
                exit 1
              fi

              if curl --fail --silent --max-time 2 \
                "$BASE_URL/" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done

            if [[ "$ready" != "true" ]]; then
              cat /tmp/adtool-preview.log
              echo "Frontend preview did not become ready"
              exit 1
            fi
          fi

          echo "Testing: $BASE_URL"
          npx playwright test \
            tests/critical-journeys.spec.ts \
            tests/public-pages.spec.ts \
            tests/seo-meta.spec.ts \
            tests/auth-flows.spec.ts \
            tests/api-health.spec.ts \
            tests/performance-budgets.spec.ts \
            tests/mobile-responsive.spec.ts \
            tests/not-found.spec.ts \
            --workers=2

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/adtool-preview.log
          if-no-files-found: ignore
          retention-days: 7
