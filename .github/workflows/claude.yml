name: Claude Code

# Opt-in only: Claude runs when a trusted collaborator writes "@claude" in an
# issue, comment or review, or applies the "claude" label to an issue.
# Setup, security notes and safe testing: docs/security/claude-code-github-action.md

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

# The job's own GITHUB_TOKEN stays read-only. Writes (comments, branches, PRs)
# go through the Claude GitHub App token obtained via OIDC (id-token: write).
permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # First gate: only the trigger phrase/label, only from OWNER/MEMBER/COLLABORATOR.
    # Second gate: the action itself rejects actors without write permission and all bots.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && github.event.action == 'opened' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' &&
        github.event.label.name == 'claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Set exactly one of these repository secrets (see docs).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: '@claude'
          label_trigger: 'claude'
          # No bots and no non-write users may invoke Claude.
          allowed_bots: ''
          claude_args: '--max-turns 30'
